name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload release files
        run: aws s3 sync deploy/ "s3://${DEPLOY_BUCKET}/releases/${GITHUB_SHA}/" --delete --only-show-errors

      - name: Deploy to EC2
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # bootstrap.sh is sent inline: it installs the AWS CLI, which the next step needs.
          boot=$(base64 -w0 deploy/bootstrap.sh)
          commands=$(jq -nc --arg boot "$boot" --arg b "$DEPLOY_BUCKET" --arg s "$GITHUB_SHA" --arg i "$IMAGE" --arg r "$AWS_REGION" '{commands: [
            "set -eu",
            "export PATH=/usr/local/bin:$PATH",
            "echo \($boot) | base64 -d > /tmp/employee-dashboard-bootstrap.sh",
            "bash /tmp/employee-dashboard-bootstrap.sh",
            "aws s3 sync s3://\($b)/releases/\($s)/ /opt/employee-dashboard/ --only-show-errors --region \($r)",
            "chmod +x /opt/employee-dashboard/deploy.sh /opt/employee-dashboard/postgres-init/*.sh",
            "/opt/employee-dashboard/deploy.sh \($i) \($r)"
          ]}')
          id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --timeout-seconds 900 --parameters "$commands" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          for _ in $(seq 1 170); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text >&2
          [ "$status" = "Success" ] || { echo "Deploy finished with status: $status" >&2; exit 1; }
